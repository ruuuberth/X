[package]
name = "xcore"
version = "0.2.0"
edition = "2021"
description = "Núcleo Rust: cliente GraphQL de X (Twitter), sesiones, media, caché"
license = "MIT"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }

