name: CI
on:
  push:
    branches: [develop]
  pull_request:
    branches: [develop]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rust:
    name: rust (host tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace

  android:
    name: android (debug APK + platform artifact)
    runs-on: ubuntu-latest
    needs: rust
    env:
      KS_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
      KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASS }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
      - uses: Swatinem/rust-cache@v2

      - name: Cargo → libxjni.so (arm64)
        run: |
          cargo install cargo-ndk --locked
          cargo ndk -t arm64-v8a -o android/app/src/main/jniLibs build --release -p x-jni

      - name: Keystore (secrets → android/local)
        run: |
          if [ -n "$KS_B64" ]; then
            mkdir -p android/local/keystore
            printf '%s' "$KS_B64" | base64 -d > android/local/keystore/xclient.keystore
            cat > android/local/keystore/keystore.properties <<EOF
          storeFile=$(pwd)/android/local/keystore/xclient.keystore
          storePassword=$KS_PASS
          keyAlias=xclient
          keyPassword=$KS_PASS
          EOF
          else
            echo "sin keystore secret: build firmado con debug keystore efímero"
          fi

      - name: Gradle (distro en el runner)
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.8.2'

      - name: Gradle assembleDebug
        run: |
          cd android
          gradle :app:assembleDebug --stacktrace

      - name: Empaquetar platforms/android-37 (recurso para builds locales nube-bloqueados)
        run: |
          cd "$ANDROID_HOME/platforms"
          zip -qr "$RUNNER_TEMP/android-37-platform.zip" android-37
          ls -lh "$RUNNER_TEMP/android-37-platform.zip"

      - name: Upload android-37-platform
        uses: actions/upload-artifact@v4
        with:
          name: android-37-platform
          path: ${{ runner.temp }}/android-37-platform.zip

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-${{ github.run_number }}
          path: android/app/build/outputs/apk/debug/app-debug.apk
