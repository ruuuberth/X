name: release
on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      KS_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
      KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASS }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
      - uses: Swatinem/rust-cache@v2

      - name: Cargo → libxjni.so (arm64)
        run: |
          cargo install cargo-ndk --locked
          cargo ndk -t arm64-v8a -o android/app/src/main/jniLibs build --release -p x-jni

      - name: Keystore (obligatorio en release)
        run: |
          if [ -z "$KS_B64" ]; then echo "FALTA secret ANDROID_KEYSTORE_B64" && exit 1; fi
          mkdir -p android/local/keystore
          printf '%s' "$KS_B64" | base64 -d > android/local/keystore/xclient.keystore
          cat > android/local/keystore/keystore.properties <<EOF
          storeFile=$(pwd)/android/local/keystore/xclient.keystore
          storePassword=$KS_PASS
          keyAlias=xclient
          keyPassword=$KS_PASS
          EOF

      - name: Gradle (distro en el runner)
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.8.2'

      - name: Gradle assembleRelease
        run: |
          cd android
          gradle :app:assembleRelease --stacktrace

      - name: Tag desde versionName
        id: ver
        run: |
          VNAME=$(jq -r '.elements[0].versionName' android/app/build/outputs/apk/release/output-metadata.json)
          echo "version=$VNAME" >> "$GITHUB_OUTPUT"
          echo "tag=v$VNAME" >> "$GITHUB_OUTPUT"

      - name: Release en GitHub
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.ver.outputs.tag }}
        run: |
          if gh release view "$TAG" > /dev/null 2>&1; then gh release delete "$TAG" --yes; fi
          gh release create "$TAG" \
            --title "X Client $TAG" \
            --notes "$(git log --oneline develop..HEAD | head -50 || git log --oneline -10)" \
            "android/app/build/outputs/apk/release/app-release.apk#xclient-$TAG.apk"
